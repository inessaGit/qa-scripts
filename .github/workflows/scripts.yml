name: QA Scripts CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]
  workflow_dispatch:

jobs:
  python-tests:
    name: Python Tests (pytest)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Run pytest
        run: |
          pytest python/test_api_health_check.py \
            --verbose \
            --tb=short \
            --no-header \
            --color=yes

      - name: Run pytest with coverage (Python 3.11 only)
        if: matrix.python-version == '3.11'
        run: |
          pip install pytest-cov
          pytest python/test_api_health_check.py \
            --cov=python \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --verbose \
            --tb=short

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  lint-python:
    name: Lint Python Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pyflakes

      - name: Lint with flake8
        run: |
          flake8 python/ \
            --max-line-length=120 \
            --exclude=__pycache__,venv,.venv \
            --statistics \
            --count

  validate-shell-scripts:
    name: Validate Shell Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on all shell scripts
        run: |
          shellcheck \
            --severity=warning \
            shell/run_tests.sh \
            shell/cleanup_reports.sh \
            shell/env_setup.sh \
            shell/check_api_endpoints.sh

  dry-run-python-scripts:
    name: Smoke Test Python Scripts
    runs-on: ubuntu-latest
    needs: [python-tests, lint-python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Smoke test generate_test_data.py
        run: |
          python python/generate_test_data.py --count 5 --seed 42
          python python/generate_test_data.py --count 3 --locale en_GB --seed 99

      - name: Smoke test generate_test_data.py with output file
        run: |
          python python/generate_test_data.py --count 10 --output-file /tmp/test_users.json
          test -f /tmp/test_users.json && echo "Output file created successfully"
          python -c "import json; data=json.load(open('/tmp/test_users.json')); assert data['meta']['count']==10"

      - name: Smoke test validate_api_schema.py (built-in schema)
        run: |
          python python/validate_api_schema.py \
            --url https://jsonplaceholder.typicode.com/posts/1 \
            --builtin-schema jsonplaceholder_post

      - name: Smoke test api_health_check.py --help
        run: |
          python python/api_health_check.py --help
